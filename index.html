<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebChatBot</title>
    <link rel="stylesheet" href="styles.css">

    <!-- Font Awesome Icon Bibliothek Add-on -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>Otto Kundenservice</h2>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- anfang message-->
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Hier Nachricht eingeben..." autofocus />
            <button onclick="sendMessage()">Senden</button>
        </div>

        <!-- von da zu info seite-->
        <div class="info-icon">
            <a href="info-page.html" target="_blank">
                <i class="fas fa-info-circle"></i> <!-- info logo-->
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
